# Selene config for the BuildKit Luau ModuleScripts in plugin/src/.
# The modules inherit a legacy warning backlog, so CI reports the count but fails on errors.
# Tighten lints as the module code is cleaned up; the blocking scope oracle remains separate.
std = "roblox"

[lints]
complexity = "allow"
shadow = "allow"
unused_variable = "allow"
unused_self = "allow"
if_same_then_else = "allow"
