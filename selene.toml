# Selene config for the BuildKit Luau plugin.
# The plugin is a single --!nocheck 5k-line file with a legacy warning backlog, so this
# is deliberately permissive: the CI job reports the warning count but doesn't fail.
# Tighten lints (and drop the --!nocheck) as the file gets split into ModuleScripts.
std = "roblox"

[lints]
complexity = "allow"
shadow = "allow"
unused_variable = "allow"
unused_self = "allow"
if_same_then_else = "allow"
