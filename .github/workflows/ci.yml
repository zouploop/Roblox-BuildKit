name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test
      - name: Audit dependencies (must stay clean)
        run: npm audit --audit-level=moderate
      # BuildKitPlugin.luau is generated from plugin/src/*.luau, and BuildKitPlugin.rbxmx
      # from that .luau — both are tracked so users can install without running the
      # toolchain. They drift if someone edits a module and commits without building.
      # Regenerate both and diff. Uses bash explicitly: the previous `\`-continuation was
      # interpreted literally by PowerShell on the Windows leg (git saw the path as
      # "\/BuildKitPlugin.rbxmx").
      - name: Check the committed plugin artifacts match their source
        shell: bash
        run: |
          node scripts/gen-rbxmx.mjs
          git diff --exit-code -- plugin/BuildKitPlugin.luau plugin/BuildKitPlugin.rbxmx \
            || { echo "::error::plugin artifacts are stale — run 'npm run build' and commit the result"; exit 1; }

  # Luau lint for the plugin — the layer with no other automated checks. Selene is a
  # headless binary, so this runs fine without Studio. The 5k-line --!nocheck file has a
  # legacy warning backlog, so this job is warn-only for now: it surfaces the count without
  # blocking merges. Bump to fail-on-warning once the backlog is cleared.
  luau-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selene
        run: |
          curl -sL https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip -o selene.zip
          unzip -o selene.zip
          sudo mv selene /usr/local/bin/
      - name: Lint the Luau plugin
        run: |
          # Lint the ASSEMBLED plugin (what Studio runs), not the individual src modules:
          # each module references top-level locals that only exist after concatenation,
          # so per-module analysis floods with false undefined_variable. Regenerate first
          # so the artifact is fresh. (Stage-2 ModuleScript split removes this indirection.)
          node scripts/gen-rbxmx.mjs >/dev/null 2>&1
          selene plugin/BuildKitPlugin.luau --config selene.toml 2>&1 || true
