name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test
      - name: Audit dependencies (must stay clean)
        run: npm audit --audit-level=moderate
      # The .rbxmx is generated from the plugin source but also tracked, so it can drift
      # if someone edits the .luau and commits without building. Regenerate and diff.
      # Uses bash explicitly: the previous `\`-continuation was interpreted literally by
      # PowerShell on the Windows leg (git saw the path as "\/BuildKitPlugin.rbxmx").
      - name: Check the committed plugin artifact matches its source
        shell: bash
        run: |
          node scripts/gen-rbxmx.mjs
          git diff --exit-code -- plugin/BuildKitPlugin.rbxmx \
            || { echo "::error::plugin/BuildKitPlugin.rbxmx is stale — run 'npm run build' and commit the result"; exit 1; }

  # Luau lint for the plugin — the layer with no other automated checks. Selene is a
  # headless binary, so this runs fine without Studio. Fail on real errors (parse
  # failures, undefined vars); the legacy warning backlog is non-fatal but counted and
  # printed so it can't silently regress. Tighten to fail-on-warning as the backlog clears.
  luau-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Selene
        run: |
          curl -sL https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip -o selene.zip
          unzip -o selene.zip
          sudo mv selene /usr/local/bin/
      - name: Lint the Luau plugin
        run: |
          # Fail on real selene errors (parse failures, undefined vars, std misuse);
          # pass on the legacy warning backlog so it doesn't block merges. The warning
          # count is printed so regressions are visible even though it's non-fatal.
          selene plugin --config selene.toml --allow-warnings --display-style=json \
            > /tmp/selene.json 2>&1 || { echo "::error::selene found errors — fix them before merging"; exit 1; }
          node -e "const fs=require('fs');const lines=fs.readFileSync('/tmp/selene.json','utf8').trim().split(/\r?\n/).filter(Boolean);let e=0,w=0;for(const l of lines){try{const j=JSON.parse(l);if(j.severity==='Error')e++;else if(j.severity==='Warning')w++}catch{}}console.log('selene: '+w+' warnings (non-fatal backlog), '+e+' errors')"
